<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IRON DISCIPLINE</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    color: white;
    text-align: center;
    overflow-x: hidden;
}

/* 🔥 PRO BACKGROUND */
body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: 
    linear-gradient(rgba(0,0,0,0.85), rgba(0,0,0,0.95)),
    url('https://images.unsplash.com/photo-1546484959-f0c44c6b5d3b?q=80&w=2070') center/cover no-repeat;
    z-index: -1;
}

/* TITLE */
.logo {
    font-size: 38px;
    color: red;
    margin-top: 20px;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px red; }
    to { text-shadow: 0 0 30px red; }
}

/* CALENDAR */
.calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
    max-width: 800px;
    margin: 20px auto;
}

.day {
    padding: 15px;
    background: rgba(255,0,0,0.15);
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s;
}

.day:hover {
    transform: scale(1.1);
    background: red;
}

.completed {
    background: green !important;
    animation: pop 0.4s ease;
}

@keyframes pop {
    0% { transform: scale(0.6); }
    100% { transform: scale(1); }
}

/* TASK BOX */
.task-box {
    background: rgba(0,0,0,0.85);
    padding: 20px;
    margin: 20px auto;
    max-width: 600px;
    border-radius: 15px;
}

.task {
    display: flex;
    justify-content: space-between;
    margin: 10px 0;
}

button {
    background: red;
    border: none;
    padding: 8px 12px;
    color: white;
    cursor: pointer;
    border-radius: 5px;
}

/* STREAK */
.streak {
    font-size: 22px;
    color: orange;
}
</style>
</head>

<body>

<div class="logo">🔥 IRON DISCIPLINE 🔥</div>
<h3>NO EXCUSES. JUST RESULTS.</h3>

<h2 id="monthYear"></h2>

<div class="calendar" id="calendar"></div>

<div class="task-box">
    <h3 id="dayTitle"></h3>
    <div id="tasks"></div>
    <div class="streak">🔥 Streak: <span id="streak">0</span></div>
</div>

<!-- 🔊 SOUND EFFECTS -->
<audio id="winSound" src="https://www.soundjay.com/human/sounds/applause-8.mp3"></audio>
<audio id="clickSound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>

<script>
const tasksList = [
    "NO JUNK FOOD",
    "NO MASTURBATION",
    "DO EXERCISE",
    "AVOID ALCOHOL"
];

let selectedDate = null;
let data = JSON.parse(localStorage.getItem("habitData")) || {};
let streak = localStorage.getItem("streak") || 0;

document.getElementById("streak").innerText = streak;

const calendar = document.getElementById("calendar");
const now = new Date();
const year = now.getFullYear();
const month = now.getMonth();

const daysInMonth = new Date(year, month+1, 0).getDate();

document.getElementById("monthYear").innerText =
now.toLocaleString('default',{month:'long'}) + " " + year;

/* CREATE CALENDAR */
for(let i=1;i<=daysInMonth;i++){
    let div = document.createElement("div");
    div.classList.add("day");
    div.innerText = i;

    let key = year+"-"+month+"-"+i;

    if(data[key] && data[key].done){
        div.classList.add("completed");
    }

    div.onclick = ()=>{
        document.getElementById("clickSound").play();
        selectedDate = key;
        showTasks(i);
    }

    calendar.appendChild(div);
}

/* AUTO SELECT TODAY */
let today = now.getDate();
selectedDate = year+"-"+month+"-"+today;
showTasks(today);

/* SHOW TASKS */
function showTasks(day){
    document.getElementById("dayTitle").innerText = "Day " + day;

    let container = document.getElementById("tasks");
    container.innerHTML = "";

    tasksList.forEach(task=>{
        let div = document.createElement("div");
        div.classList.add("task");

        let btn = document.createElement("button");
        btn.innerText = "Complete";

        btn.onclick = ()=>{
            completeDay();
        }

        div.innerHTML = "<span>"+task+"</span>";
        div.appendChild(btn);
        container.appendChild(div);
    });
}

/* COMPLETE DAY */
function completeDay(){
    if(!selectedDate) return;

    data[selectedDate] = { done: true };
    localStorage.setItem("habitData", JSON.stringify(data));

    streak++;
    localStorage.setItem("streak", streak);

    document.getElementById("streak").innerText = streak;

    document.getElementById("winSound").play();

    alert("🔥 WOW BABE! YOU DID IT 🔥");

    location.reload();
}
</script>

</body>
</html>
