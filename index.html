<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IRON DISCIPLINE</title>

<style>
body {
    margin:0;
    font-family: Arial;
    color:white;
    text-align:center;
    background: black;
}

/* 🔥 BACKGROUND */
body::before {
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background:
    linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.95)),
    url("https://images.unsplash.com/photo-1549719386-74dfcbf7dbed");
    background-size:cover;
    background-position:center;
    z-index:-1;
}

/* TITLE */
h1 {
    color:red;
    margin-top:20px;
}

/* CALENDAR */
.calendar {
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:10px;
    width:90%;
    margin:auto;
}

.day {
    padding:20px;
    border:1px solid red;
    border-radius:10px;
    cursor:pointer;
}

.completed {
    background:green;
}

/* TASK BOX */
.box {
    margin-top:20px;
    padding:20px;
    background:rgba(0,0,0,0.8);
    border-radius:15px;
}

/* BUTTON */
button {
    background:red;
    color:white;
    border:none;
    padding:10px 20px;
    cursor:pointer;
}
</style>
</head>

<body>

<h1>🔥 IRON DISCIPLINE 🔥</h1>
<h2 id="month"></h2>

<div class="calendar" id="calendar"></div>

<div class="box">
    <h2 id="dayTitle">Select a Day</h2>

    <div>
        <label><input type="checkbox" class="task"> NO JUNK FOOD</label><br>
        <label><input type="checkbox" class="task"> NO MASTURBATION</label><br>
        <label><input type="checkbox" class="task"> DO EXERCISE</label><br>
        <label><input type="checkbox" class="task"> AVOID ALCOHOL</label>
    </div>

    <br>
    <button onclick="completeDay()">COMPLETE DAY</button>

    <h3 id="streak">🔥 Streak: 0</h3>
</div>

<audio id="sound" src="https://www.soundjay.com/human/sounds/applause-8.mp3"></audio>

<script>
let selectedDay = null;
let data = JSON.parse(localStorage.getItem("habitData")) || {};
let streak = localStorage.getItem("streak") || 0;

document.getElementById("streak").innerText = "🔥 Streak: " + streak;

/* REAL DATE */
const today = new Date();
const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
document.getElementById("month").innerText =
monthNames[today.getMonth()] + " " + today.getFullYear();

/* CREATE CALENDAR */
for(let i=1;i<=30;i++){
    let div = document.createElement("div");
    div.className="day";
    div.innerText=i;

    if(data[i]?.done) div.classList.add("completed");

    div.onclick=()=>{
        selectedDay=i;
        document.getElementById("dayTitle").innerText="Day "+i;
    };

    document.getElementById("calendar").appendChild(div);
}

/* COMPLETE DAY */
function completeDay(){
    if(!selectedDay) return;

    data[selectedDay] = {done:true};
    localStorage.setItem("habitData", JSON.stringify(data));

    streak++;
    localStorage.setItem("streak", streak);

    document.getElementById("sound").play();

    alert("🔥 WOW CHAMP! DAY COMPLETED 🔥");

    location.reload();
}
</script>

</body>
</html>
