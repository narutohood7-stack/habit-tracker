<!DOCTYPE html>
<html>
<head>
  <title>🔥 UFC Habit Tracker</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI';
      color: white;
      text-align: center;
      background: url("https://images.unsplash.com/photo-1605296867304-46d5465a13f1") no-repeat center/cover;
    }

    .overlay {
      background: rgba(0,0,0,0.85);
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      color: red;
      letter-spacing: 2px;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 10px red; }
      to { text-shadow: 0 0 25px red; }
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
      max-width: 600px;
      margin: auto;
    }

    .day {
      padding: 15px;
      background: rgba(255,0,0,0.2);
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    .day:hover {
      transform: scale(1.1);
      background: red;
    }

    .active {
      background: red;
    }

    .card {
      margin-top: 20px;
      background: rgba(0,0,0,0.7);
      padding: 20px;
      border-radius: 15px;
    }

    input {
      padding: 10px;
      width: 60%;
      border-radius: 5px;
      border: none;
    }

    button {
      padding: 10px;
      background: red;
      border: none;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: darkred;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    @media(max-width:600px){
      .calendar {
        grid-template-columns: repeat(4, 1fr);
      }
    }
  </style>
</head>

<body>
<div class="overlay">

<div class="top-bar">
  <h1>🔥 HABIT TRACKER</h1>
  <button onclick="logout()">Logout</button>
</div>

<h2 id="monthYear"></h2>

<div class="calendar" id="calendar"></div>

<div class="card">
  <h3 id="selectedDate">Select a day</h3>

  <input id="taskInput" placeholder="Enter habit">
  <button onclick="addTask()">Add</button>

  <h3 id="streak">Streak: 0 🔥</h3>
</div>

</div>

<script>
  const calendar = document.getElementById("calendar");
  const monthYear = document.getElementById("monthYear");

  let date = new Date();
  let currentMonth = date.getMonth();
  let currentYear = date.getFullYear();
  let selectedDate = null;
  let streak = 0;

  const months = [
    "January","February","March","April","May","June",
    "July","August","September","October","November","December"
  ];

  monthYear.innerText = months[currentMonth] + " " + currentYear;

  function generateCalendar() {
    calendar.innerHTML = "";

    let daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();

    for (let i = 1; i <= daysInMonth; i++) {
      let day = document.createElement("div");
      day.classList.add("day");
      day.innerText = i;

      day.onclick = () => {
        document.querySelectorAll(".day").forEach(d => d.classList.remove("active"));
        day.classList.add("active");

        selectedDate = i;
        document.getElementById("selectedDate").innerText =
          "Selected: " + i + " " + months[currentMonth];
      };

      calendar.appendChild(day);
    }
  }

  generateCalendar();

  function addTask() {
    if (!selectedDate) {
      alert("Select a day first!");
      return;
    }

    let task = document.getElementById("taskInput").value;

    localStorage.setItem(currentYear + "-" + currentMonth + "-" + selectedDate, task);

    streak++;
    updateStreak();

    document.getElementById("taskInput").value = "";
  }

  function updateStreak() {
    document.getElementById("streak").innerText = "Streak: " + streak + " 🔥";
  }

  function logout() {
    alert("Logged out (demo)");
  }
</script>

</body>
</html>
