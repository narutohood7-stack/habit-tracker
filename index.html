<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Iron Discipline Tracker</title>

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    color: white;
    text-align: center;
    background: black;
    overflow-x: hidden;
}

/* 🔥 BACKGROUND IMAGE */
body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background: url('https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?q=80&w=2070') center/cover;
    filter: brightness(0.25);
    z-index: -1;
}

/* TITLE */
.logo {
    font-size: 36px;
    font-weight: bold;
    color: red;
    margin-top: 20px;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px red; }
    to { text-shadow: 0 0 25px red; }
}

/* CALENDAR */
.calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
    max-width: 800px;
    margin: 20px auto;
}

.day {
    padding: 15px;
    background: rgba(255,0,0,0.1);
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s;
}

.day:hover {
    background: red;
}

.completed {
    background: green !important;
}

/* TASK BOX */
.task-box {
    background: rgba(0,0,0,0.8);
    padding: 20px;
    margin: 20px auto;
    max-width: 600px;
    border-radius: 15px;
}

.task {
    display: flex;
    justify-content: space-between;
    margin: 10px 0;
}

button {
    background: red;
    border: none;
    padding: 8px 12px;
    color: white;
    cursor: pointer;
    border-radius: 5px;
}

/* STREAK */
.streak {
    font-size: 22px;
    margin-top: 10px;
    color: orange;
}
</style>
</head>

<body>

<div class="logo">🔥 IRON DISCIPLINE 🔥</div>

<h2 id="monthYear"></h2>

<div class="calendar" id="calendar"></div>

<div class="task-box">
    <h3 id="dayTitle">Select a Day</h3>

    <div id="tasks"></div>

    <div class="streak">🔥 Streak: <span id="streak">0</span></div>
</div>

<!-- 🔊 SOUND -->
<audio id="sound" src="https://www.soundjay.com/human/sounds/applause-8.mp3"></audio>

<script>
const tasksList = [
    "NO JUNK FOOD",
    "NO MASTURBATION",
    "DO EXERCISE",
    "AVOID ALCOHOL"
];

let selectedDate = null;
let data = JSON.parse(localStorage.getItem("habitData")) || {};
let streak = localStorage.getItem("streak") || 0;

document.getElementById("streak").innerText = streak;

const calendar = document.getElementById("calendar");
const monthYear = document.getElementById("monthYear");

const now = new Date();
const year = now.getFullYear();
const month = now.getMonth();

const daysInMonth = new Date(year, month+1, 0).getDate();

monthYear.innerText = now.toLocaleString('default', { month: 'long' }) + " " + year;

/* CREATE CALENDAR */
for(let i=1;i<=daysInMonth;i++){
    let div = document.createElement("div");
    div.classList.add("day");
    div.innerText = i;

    let key = year+"-"+month+"-"+i;

    if(data[key] && data[key].done){
        div.classList.add("completed");
    }

    div.onclick = ()=>{
        selectedDate = key;
        showTasks(i);
    }

    calendar.appendChild(div);
}

/* SHOW TASKS */
function showTasks(day){
    document.getElementById("dayTitle").innerText = "Day " + day;
    let container = document.getElementById("tasks");
    container.innerHTML = "";

    tasksList.forEach((task,index)=>{
        let div = document.createElement("div");
        div.classList.add("task");

        let btn = document.createElement("button");
        btn.innerText = "Complete";

        btn.onclick = ()=>{
            completeTask();
        }

        div.innerHTML = "<span>"+task+"</span>";
        div.appendChild(btn);

        container.appendChild(div);
    });
}

/* COMPLETE DAY */
function completeTask(){
    if(!selectedDate) return;

    data[selectedDate] = { done: true };
    localStorage.setItem("habitData", JSON.stringify(data));

    streak++;
    localStorage.setItem("streak", streak);

    document.getElementById("streak").innerText = streak;

    document.getElementById("sound").play();

    alert("🔥 WOW BABE! DAY COMPLETED 🔥");

    location.reload();
}
</script>

</body>
</html>
