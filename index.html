<!DOCTYPE html>
<html>
<head>
<title>Aryan & Sanskar Tracker</title>

<style>
body {
  margin:0;
  font-family: 'Segoe UI';
  background: black;
  color:white;
  overflow-x:hidden;
}

/* BACKGROUND IMAGE */
body::before{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:url('https://images.unsplash.com/photo-1549719386-74dfcbf7dbed?auto=format&fit=crop&w=1600&q=80') center/cover;
  opacity:0.2;
  z-index:-1;
}

/* LOGO */
.logo{
  text-align:center;
  font-size:32px;
  color:#ff2e2e;
  font-weight:bold;
  padding:20px;
  text-shadow:0 0 15px red;
}

/* CARD */
.card{
  background:rgba(20,0,0,0.7);
  border-radius:15px;
  padding:20px;
  margin:20px auto;
  width:90%;
  max-width:900px;
  box-shadow:0 0 20px red;
}

/* CALENDAR */
.calendar-header{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:10px;
}

.day{
  padding:15px;
  background:#1a1a1a;
  text-align:center;
  border-radius:10px;
  cursor:pointer;
  transition:0.3s;
}

.day:hover{
  background:red;
  transform:scale(1.1);
}

.active{
  background:red;
}

/* TASK INPUT */
input{
  padding:10px;
  width:70%;
  border-radius:8px;
  border:none;
}

button{
  padding:10px;
  background:red;
  border:none;
  color:white;
  border-radius:8px;
  cursor:pointer;
}

button:hover{
  background:#ff4444;
}

/* TASK LIST */
.task{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
  background:#111;
  padding:10px;
  border-radius:8px;
}

.completed{
  text-decoration:line-through;
  color:gray;
}

/* MOTIVATION */
.motivation{
  text-align:center;
  margin-top:15px;
  color:#ff5555;
  font-style:italic;
}

/* STREAK */
.streak{
  text-align:center;
  margin-top:10px;
  font-size:18px;
}

</style>
</head>

<body>

<div class="logo">🔥 ARYAN & SANSKAR 🔥</div>

<div class="card">
  <div class="calendar-header">
    <button onclick="prevMonth()">⬅</button>
    <h2 id="month"></h2>
    <button onclick="nextMonth()">➡</button>
  </div>

  <div class="calendar-grid" id="calendar"></div>
</div>

<div class="card">
  <h3 id="selectedDay">Select a Day</h3>

  <input id="taskInput" placeholder="Add task">
  <button onclick="addTask()">Add</button>

  <div id="tasks"></div>

  <div class="streak">🔥 Streak: <span id="streak">0</span></div>

  <div class="motivation" id="motivation"></div>
</div>

<script>

let date = new Date();
let selectedDate = null;

function renderCalendar(){
  const calendar = document.getElementById("calendar");
  calendar.innerHTML = "";

  const year = date.getFullYear();
  const month = date.getMonth();

  document.getElementById("month").innerText =
    date.toLocaleString('default',{month:'long'}) + " " + year;

  const firstDay = new Date(year,month,1).getDay();
  const days = new Date(year,month+1,0).getDate();

  for(let i=0;i<firstDay;i++){
    calendar.innerHTML += "<div></div>";
  }

  for(let d=1; d<=days; d++){
    const div = document.createElement("div");
    div.className="day";
    div.innerText=d;

    div.onclick=()=>{
      selectedDate = year+"-"+month+"-"+d;
      document.getElementById("selectedDay").innerText =
        "Tasks for "+d+" "+date.toLocaleString('default',{month:'long'});
      loadTasks();
    }

    calendar.appendChild(div);
  }
}

function prevMonth(){
  date.setMonth(date.getMonth()-1);
  renderCalendar();
}

function nextMonth(){
  date.setMonth(date.getMonth()+1);
  renderCalendar();
}

/* TASK SYSTEM */
function getTasks(){
  return JSON.parse(localStorage.getItem(selectedDate)) || [];
}

function saveTasks(tasks){
  localStorage.setItem(selectedDate, JSON.stringify(tasks));
}

function addTask(){
  const input = document.getElementById("taskInput");
  if(!input.value) return;

  let tasks = getTasks();
  tasks.push({text:input.value,done:false});
  saveTasks(tasks);
  input.value="";
  loadTasks();
}

function loadTasks(){
  const container = document.getElementById("tasks");
  container.innerHTML="";

  let tasks = getTasks();

  tasks.forEach((t,i)=>{
    const div=document.createElement("div");
    div.className="task";

    const span=document.createElement("span");
    span.innerText=t.text;
    if(t.done) span.classList.add("completed");

    span.onclick=()=>{
      t.done=!t.done;
      saveTasks(tasks);
      loadTasks();
      updateStreak();
      showMotivation();
    }

    const del=document.createElement("button");
    del.innerText="❌";
    del.onclick=()=>{
      tasks.splice(i,1);
      saveTasks(tasks);
      loadTasks();
    }

    div.appendChild(span);
    div.appendChild(del);
    container.appendChild(div);
  });

  updateStreak();
}

/* STREAK */
function updateStreak(){
  let streak=0;

  for(let i=0;i<localStorage.length;i++){
    let key=localStorage.key(i);
    let tasks=JSON.parse(localStorage.getItem(key));

    if(tasks && tasks.every(t=>t.done)){
      streak++;
    }
  }

  document.getElementById("streak").innerText=streak;
}

/* MOTIVATION */
const quotes=[
"Pain is temporary. Glory is forever.",
"Discipline beats motivation.",
"No excuses.",
"Train like a fighter.",
"Be stronger than yesterday."
];

function showMotivation(){
  const q=quotes[Math.floor(Math.random()*quotes.length)];
  document.getElementById("motivation").innerText=q;
}

renderCalendar();

</script>

</body>
</html>
