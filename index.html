
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IRON DISCIPLINE</title>

<style>
body {
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  color:white;
  text-align:center;
  background:black;
}

/* 🔥 BACKGROUND */
body::before{
  content:"";
  position:fixed;
  width:100%;
  height:100%;
  background:
    linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.9)),
    url("https://images.unsplash.com/photo-1549719386-74dfcbf7dbed?auto=format&fit=crop&w=1400&q=80");
  background-size:cover;
  background-position:center;
  z-index:-1;
}

/* TITLE */
h1{
  color:#ff2e2e;
  font-size:40px;
  margin-top:20px;
  text-shadow:0 0 20px red;
}

/* MONTH */
#month{
  font-size:24px;
  margin:10px;
}

/* CALENDAR */
.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:10px;
  max-width:500px;
  margin:auto;
}

.day{
  padding:15px;
  background:#1a1a1a;
  border-radius:10px;
  cursor:pointer;
  transition:0.3s;
  border:1px solid #333;
}

.day:hover{
  background:#ff2e2e;
}

.completed{
  background:green !important;
}

/* CARD */
.card{
  background:rgba(0,0,0,0.7);
  margin:20px auto;
  padding:20px;
  border-radius:15px;
  max-width:500px;
  border:1px solid red;
}

/* TASK */
.task{
  display:flex;
  justify-content:space-between;
  background:#111;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
}

button{
  background:red;
  border:none;
  color:white;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
}

/* PROGRESS */
.progress{
  height:10px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0%;
  background:red;
  transition:0.5s;
}
</style>
</head>

<body>

<h1>🔥 IRON DISCIPLINE 🔥</h1>
<div id="month"></div>

<div class="calendar" id="calendar"></div>

<div class="card">
  <h3>Today's Tasks</h3>

  <div class="task">
    <span>🍔 NO JUNK FOOD</span>
    <input type="checkbox" onclick="checkTask(this)">
  </div>

  <div class="task">
    <span>🚫 NO MASTURBATION</span>
    <input type="checkbox" onclick="checkTask(this)">
  </div>

  <div class="task">
    <span>🏋️ DO EXERCISE</span>
    <input type="checkbox" onclick="checkTask(this)">
  </div>

  <div class="task">
    <span>🚫 AVOID ALCOHOL</span>
    <input type="checkbox" onclick="checkTask(this)">
  </div>

  <br>
  <button onclick="completeDay()">COMPLETE DAY</button>

  <p>🔥 Streak: <span id="streak">0</span></p>

  <div class="progress">
    <div class="progress-bar" id="bar"></div>
  </div>

</div>

<audio id="sound" src="https://www.soundjay.com/button/beep-07.wav"></audio>

<script>
let date = new Date();
let year = date.getFullYear();
let month = date.getMonth();

let data = JSON.parse(localStorage.getItem("habitData")) || {};
let streak = localStorage.getItem("streak") || 0;

document.getElementById("streak").innerText = streak;

function loadCalendar(){
  const cal = document.getElementById("calendar");
  cal.innerHTML = "";

  const days = new Date(year, month+1, 0).getDate();

  document.getElementById("month").innerText =
    date.toLocaleString('default', { month: 'long' }) + " " + year;

  for(let i=1;i<=days;i++){
    let d = document.createElement("div");
    d.className="day";
    d.innerText=i;

    let key = year+"-"+month+"-"+i;

    if(data[key]) d.classList.add("completed");

    cal.appendChild(d);
  }
}

function checkTask(el){
  let checked = document.querySelectorAll("input:checked").length;
  let percent = (checked/4)*100;
  document.getElementById("bar").style.width = percent+"%";
}

function completeDay(){
  let checked = document.querySelectorAll("input:checked").length;

  if(checked < 4){
    alert("Complete all tasks!");
    return;
  }

  let today = new Date().getDate();
  let key = year+"-"+month+"-"+today;

  data[key]=true;
  localStorage.setItem("habitData", JSON.stringify(data));

  streak++;
  localStorage.setItem("streak", streak);

  document.getElementById("sound").play();

  alert("🔥 WOW! DISCIPLINE LEVEL UP!");

  location.reload();
}

loadCalendar();
</script>

</body>
</html>
